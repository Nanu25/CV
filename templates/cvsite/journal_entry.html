{% extends "cvsite/layout.html" %}

{% block content %}
<div class="journal-entry-page">
    <div class="journal-entry-container">
        <a href="{% url 'index' %}" class="journal-entry-back" title="Back to Home">
            <i class="fas fa-arrow-left"></i>
            <span>Home</span>
        </a>

        <article class="journal-entry-card">
            <header class="journal-entry-header">
                <h1 class="journal-entry-title">{{ entry.title }}</h1>
                <p class="journal-entry-date">
                    <i class="fas fa-calendar-alt"></i>
                    <span>{{ entry.date }}</span>
                </p>
            </header>
            <div class="journal-entry-content">
                {{ entry.content|linebreaks }}
            </div>
        </article>

        <div class="journal-entry-actions">
            <a href="{% url 'index' %}" class="btn-about btn-about-back">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
